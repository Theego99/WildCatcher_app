# .github/workflows/release-macos.yml
# Usage: git tag mac-v1.0.0 && git push origin mac-v1.0.0

name: Release macOS

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch (conversion only). 2.7.1 = legacy ONNX exporter, no onnxscript needed.
          pip install torch==2.7.1 torchvision==0.22.1
          pip install -r requirements-base.txt
          pip install pyinstaller

      - name: Verify ONNX Runtime providers
        run: python -c "import onnxruntime as ort; print('ORT', ort.__version__); print(ort.get_available_providers())"

      - name: Convert built-in detector to ONNX (build-time only)
        # ultralytics + yolov5's module-load deps (pandas/seaborn/tqdm) are needed
        # only to load the YOLOv5 .pt for conversion; NONE are bundled into the app
        # (the spec excludes yolov5/ultralytics and the runtime never imports them).
        run: |
          pip install ultralytics pandas seaborn tqdm
          python tools/convert_to_onnx.py

      - name: Build with PyInstaller
        run: pyinstaller wildcatcher.spec

      - name: Zip output
        run: |
          cd dist
          zip -r ../WildCatcher-macOS-arm64.zip WildCatcher.app || zip -r ../WildCatcher-macOS-arm64.zip WildCatcher
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WildCatcher macOS ${{ github.ref_name }}
          body: |
            ### macOS Download
            GPU acceleration is automatic on Apple Silicon (M1/M2/M3/M4) via
            ONNX Runtime's CoreML provider; falls back to CPU otherwise.

            **Note:** for video playback, install [VLC](https://www.videolan.org/vlc/)
            (detection/classification does not require it).

            **Install:** Download → Extract → Run `WildCatcher`
            If macOS says "app is damaged": `xattr -cr /path/to/WildCatcher`
          files: WildCatcher-macOS-arm64.zip
