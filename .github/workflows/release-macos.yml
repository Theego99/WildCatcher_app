# .github/workflows/release-macos.yml
# Usage: git tag mac-v1.0.0 && git push origin mac-v1.0.0

name: Release macOS

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision
          pip install -r requirements-base.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller wildcatcher.spec

      - name: Zip output
        run: |
          cd dist
          zip -r ../WildCatcher-macOS-arm64.zip WildCatcher.app || zip -r ../WildCatcher-macOS-arm64.zip WildCatcher
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WildCatcher macOS ${{ github.ref_name }}
          body: |
            ### macOS Download
            GPU acceleration is automatic on Apple Silicon (M1/M2/M3/M4) via MPS.

            **Install:** Download → Extract → Run `WildCatcher`
            If macOS says "app is damaged": `xattr -cr /path/to/WildCatcher.app`
          files: WildCatcher-macOS-arm64.zip
