# .github/workflows/release-macos.yml
# Usage: git tag mac-v1.0.0 && git push origin mac-v1.0.0

name: Release macOS

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch (conversion only). 2.7.1 = legacy ONNX exporter, no onnxscript needed.
          pip install torch==2.7.1 torchvision==0.22.1
          pip install -r requirements-base.txt
          pip install pyinstaller

      - name: Verify ONNX Runtime providers
        run: python -c "import onnxruntime as ort; print('ORT', ort.__version__); print(ort.get_available_providers())"

      - name: Convert built-in detector to ONNX (build-time only)
        # ultralytics + yolov5's module-load deps (pandas/seaborn/tqdm) are needed
        # only to load the YOLOv5 .pt for conversion; NONE are bundled into the app
        # (the spec excludes yolov5/ultralytics and the runtime never imports them).
        run: |
          pip install ultralytics pandas seaborn tqdm
          python tools/convert_to_onnx.py

      - name: Build with PyInstaller
        run: pyinstaller wildcatcher.spec

      - name: Package .app (ad-hoc sign + ditto zip)
        run: |
          APP="dist/WildCatcher.app"
          if [ ! -d "$APP" ]; then echo "ERROR: $APP not found"; ls -la dist; exit 1; fi
          # Apple Silicon requires at least an ad-hoc signature to launch.
          codesign --force --deep --sign - "$APP" || echo "ad-hoc sign failed (continuing)"
          # ditto preserves the bundle's executable bits/symlinks (zip -r can break .app)
          ditto -c -k --keepParent "$APP" WildCatcher-macOS-arm64.zip
          ls -lh WildCatcher-macOS-arm64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WildCatcher macOS ${{ github.ref_name }}
          body: |
            ### macOS download (Apple Silicon)
            GPU acceleration via ONNX Runtime CoreML; CPU fallback otherwise.

            **Install:**
            1. Download and unzip → you get **`WildCatcher.app`** (move it to Applications if you like).
            2. The app is unsigned, so the first time: **right-click the app → Open → Open**.
               (Plain double-click is blocked by Gatekeeper until you do this once.)
            3. If macOS says it's "damaged"/can't be opened, run once in Terminal:
               `xattr -dr com.apple.quarantine /path/to/WildCatcher.app`

            **Video playback** requires [VLC](https://www.videolan.org/vlc/) installed;
            detection, classification and report export work without it.
          files: WildCatcher-macOS-arm64.zip
