# .github/workflows/release-windows.yml
# Usage: git tag win-v1.0.0 && git push origin win-v1.0.0

name: Release Windows

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller wildcatcher.spec

      - name: Show output
        run: |
          Get-ChildItem dist/WildCatcher/ | Select-Object Name, Length | Format-Table
          $size = (Get-ChildItem dist/WildCatcher/ -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Total folder size: $([math]::Round($size,1)) MB"

      - name: Zip output
        run: Compress-Archive -Path dist/WildCatcher -DestinationPath WildCatcher-Windows-x64.zip

      - name: Show zip size
        run: Get-Item WildCatcher-Windows-x64.zip | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WildCatcher Windows ${{ github.ref_name }}
          body: |
            ### Windows Download
            Works out of the box on CPU.

            **For NVIDIA GPU acceleration**, run:
            `pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121`

            **Install:** Download → Extract the `WildCatcher` folder → Run `WildCatcher.exe` inside it
          files: WildCatcher-Windows-x64.zip
