# .github/workflows/release-windows.yml
# Usage: git tag win-v1.0.0 && git push origin win-v1.0.0

name: Release Windows

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: used only to convert user-added models to ONNX, not for inference.
          # Pinned to 2.7.1 (legacy ONNX exporter; newer torch needs the extra onnxscript dep).
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          pip install pyinstaller

      - name: Verify ONNX Runtime GPU provider
        run: |
          python -c "import onnxruntime as ort; print('ORT', ort.__version__); print('providers', ort.get_available_providers())"

      - name: Convert built-in detector to ONNX (build-time only)
        # ultralytics + yolov5's module-load deps (pandas/seaborn/tqdm) are needed
        # only to load the YOLOv5 .pt for conversion; NONE are bundled into the app
        # (the spec excludes yolov5/ultralytics and the runtime never imports them).
        run: |
          pip install ultralytics pandas seaborn tqdm
          python tools/convert_to_onnx.py

      - name: Build with PyInstaller
        run: pyinstaller wildcatcher.spec

      - name: Smoke test - verify exe starts
        run: |
          $proc = Start-Process -FilePath "dist\WildCatcher\WildCatcher.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "ERROR: App exited with code $($proc.ExitCode)"
            exit 1
          } else {
            Write-Host "SUCCESS: App is running (PID $($proc.Id))"
            Stop-Process -Id $proc.Id -Force
          }
        shell: powershell

      - name: Show folder size
        run: |
          $size = (Get-ChildItem dist/WildCatcher/ -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Total folder size: $([math]::Round($size,1)) MB"

      - name: Compress with 7z
        run: 7z a -t7z -mx=9 WildCatcher-Windows-x64.7z dist/WildCatcher/

      - name: Show archive size
        run: Get-Item WildCatcher-Windows-x64.7z | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WildCatcher Windows ${{ github.ref_name }}
          body: |
            ### Windows Download
            GPU-accelerated via DirectML — works on any DirectX 12 GPU
            (NVIDIA, AMD, Intel). Falls back to CPU automatically if none found.

            **Install:**
            1. Download `WildCatcher-Windows-x64.7z`
            2. Extract with [7-Zip](https://www.7-zip.org/) or WinRAR
            3. Open the `WildCatcher` folder
            4. Run `WildCatcher.exe`
          files: WildCatcher-Windows-x64.7z
